name: Build hashcat

on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "*"
    paths:
      - '.github/workflows/build.yml'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      FORCE_BUILD: ${{ github.event.inputs.force || '0' }}

    steps:
      # 只恢复，不自动保存。run_id 作为 primary key 永远不命中，
      # 实际总是通过 restore-keys 前缀拿到最近一次 save 的 .cache
      - name: Restore last upstream SHA cache
        uses: actions/cache/restore@v5
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-sha-${{ runner.os }}-

      # 检查上游是否有更新
      - id: check_upstream
        name: Check upstream changes
        shell: bash
        run: |
          mkdir -p .cache

          # 获取上游最新 commit
          git clone --depth=1 https://github.com/hashcat/hashcat.git tmprepo
          NEW_SHA=$(cd tmprepo && git rev-parse HEAD)
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT
          echo "Found upstream NEW_SHA=$NEW_SHA"

          if [ -f .cache/last_sha ]; then
            OLD_SHA=$(cat .cache/last_sha)
          else
            OLD_SHA=""
          fi
          echo "old_sha=$OLD_SHA" >> $GITHUB_OUTPUT
          echo "Found cached OLD_SHA=$OLD_SHA"

          if [ "${FORCE_BUILD}" = "1" ]; then
            echo "FORCE_BUILD=1 -> 强制编译"
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            if [ "$NEW_SHA" = "$OLD_SHA" ]; then
              echo "No upstream changes, skipping build."
              echo "skip=true" >> $GITHUB_OUTPUT
              rm -rf tmprepo
              exit 0
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

          # 清理临时仓库
          rm -rf tmprepo
        env:
          FORCE_BUILD: ${{ env.FORCE_BUILD }}

      # 下面的所有构建相关步骤都加上条件
      - name: Checkout repository
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: actions/checkout@v7

      - name: Install Build Dependencies
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            make git zstd python3-dev cmake p7zip-full

      - name: Clone Source Code
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          sudo rm -rf hashcat win-iconv
          git clone https://github.com/hashcat/hashcat.git
          git clone https://github.com/win-iconv/win-iconv.git

      # 缓存必须在 clone 之后，否则 hashFiles 找不到 Cargo.lock，key 会是空后缀
      - name: Cache cargo registry + index
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('hashcat/Rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # 路径必须是 Makefile 实际使用的 --target-dir 目录
      - name: Cache cargo build
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            hashcat/Rust/bridges/dynamic_hash/target
            hashcat/Rust/bridges/generic_hash/target
            hashcat/Rust/feeds/random/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('hashcat/Rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # 用合法的 targets 输入一次装好 Windows target，
      # 不再传无效的 override/profile，也删掉单独的 rustup target add 步骤
      - name: Set up Rust
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Compile and Install win-iconv
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          cd win-iconv/
          cmake \
            -D WIN_ICONV_BUILD_EXECUTABLE=OFF \
            -D CMAKE_INSTALL_PREFIX=/opt/win-iconv-64 \
            -D CMAKE_CXX_COMPILER=$(which x86_64-w64-mingw32-g++) \
            -D CMAKE_C_COMPILER=$(which x86_64-w64-mingw32-gcc) \
            -D CMAKE_SYSTEM_NAME=Windows
          sudo make install
          cd ../

      - name: Install Windows Python
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          wget https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-python-3.12.10-1-any.pkg.tar.zst
          sudo mkdir -p /opt/win-python
          sudo tar --zstd -xf mingw-w64-x86_64-python-3.12.10-1-any.pkg.tar.zst -C /opt/win-python

      - name: Build hashcat
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        shell: bash
        run: |
          cd hashcat/
          make clean

          export CC=x86_64-w64-mingw32-gcc
          export CXX=x86_64-w64-mingw32-g++
          export CARGO_BUILD_TARGET=x86_64-pc-windows-gnu
          export CFLAGS="-I/opt/win-iconv-64/include -static"
          export LDFLAGS="-L/opt/win-iconv-64/lib -static"

          make -j$(nproc) win \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            STATIC=1 \
            ENABLE_LTO=1 \
            ICONV_HOME=/opt/win-iconv-64 \
            V=1

      - name: Get Hashcat Version String
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        id: get_version
        run: |
          cd hashcat/
          VERSION_STRING=$(git describe --tags --always)
          echo "version=${VERSION_STRING}" >> $GITHUB_OUTPUT

      - name: Package Release Artifact
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        id: package_release
        run: |
          cd hashcat/
          ARCHIVE_NAME="hashcat_${{ steps.get_version.outputs.version }}.7z"
          7z a ../$ARCHIVE_NAME \
            hashcat.exe \
            hashcat.dll \
            hashcat.hcstat2 \
            OpenCL/ \
            modules/*.dll \
            rules/ \
            feeds/*.dll \
            masks/ \
            charsets/ \
            tunings/ \
            docs/ \
            Python/ \
            tools/*.py \
            tools/*.pl \
            extra/ \
            example* \
            pcfg/ \
            bridges/ \
            '-xr!*.so'
          echo "archive_path=./$ARCHIVE_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.package_release.outputs.archive_path }}
          name: hashcat ${{ steps.get_version.outputs.version }}
          tag: ${{ steps.get_version.outputs.version }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # 构建成功后保存新的 SHA 到缓存文件
      - name: Save SHA to cache file
        if: ${{ steps.check_upstream.outputs.skip == 'false' }}
        run: |
          mkdir -p .cache
          echo "${{ steps.check_upstream.outputs.new_sha }}" > .cache/last_sha
          echo "Saved SHA ${{ steps.check_upstream.outputs.new_sha }} to .cache/last_sha"

      # 只保存，不再用 run_id 作为 key。
      # FORCE_BUILD=1 重复构建同一 SHA 时 key 已存在，continue-on-error 避免步骤失败
      - name: Save last upstream SHA to cache
        if: ${{ steps.check_upstream.outputs.skip == 'false' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache
          key: upstream-sha-${{ runner.os }}-${{ steps.check_upstream.outputs.new_sha }}
